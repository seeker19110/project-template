name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect project manifest
        id: project
        shell: bash
        run: |
          manifests=(package.json pyproject.toml requirements.txt go.mod Cargo.toml pom.xml build.gradle build.gradle.kts Gemfile composer.json)
          for file in "${manifests[@]}"; do
            if [ -f "$file" ]; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "Found $file"
              exit 0
            fi
          done
          echo "exists=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Framework source has no project manifest; dependency review activates after copy into a project."

      - name: Review dependency changes
        if: steps.project.outputs.exists == 'true'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
